[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "udp-tcp-log-collector"
version = "0.1.0"
description = "UDP and TCP based centralized log collection project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
log-collector = "log_collector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]